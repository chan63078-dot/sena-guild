<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="세븐나이츠 리버스 길드전 족보 · 방어 추천 · 공략 모음">
<meta property="og:title" content="길드전 족보">
<meta property="og:description" content="상대 방어덱별 공격덱 · 스킬 순서 · 펫 · 세팅">
<link rel="icon" href="pt/0.webp">
<title>길드전 족보</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style id="css">
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --surface-2:#F5F6F9; --line:#DADDE5;
  --ink:#161A22; --muted:#5A6172; --faint:#8A90A0;
  --def:#2F5D9E; --def-bg:#E4ECF8;
  --atk:#B3261E; --atk-bg:#FBE7E5;
  --gold:#8A6212; --gold-bg:#FBF1DB; --gold-line:#E7CF97;
  --warn:#9A5B00; --warn-bg:#FFF3DC;
  --pet:#2D6A4F; --pet-bg:#E2F1E8;
  --focus:#2F5D9E;
  --accent:#C2185B; --banner-bg:linear-gradient(105deg,#FFFFFF 0%,#FDF1F4 55%,#F9DCE4 100%); --banner-line:#F1D3DB;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11141A; --surface:#1A1E26; --surface-2:#222731; --line:#2E3440;
    --ink:#E8EBF1; --muted:#A3AABA; --faint:#747B8C;
    --def:#8DB4EE; --def-bg:#1E2B40;
    --atk:#F29B94; --atk-bg:#3A1F1E;
    --gold:#E9C46F; --gold-bg:#33291A; --gold-line:#5A4724;
    --warn:#F2C069; --warn-bg:#34281A;
    --pet:#8FD3AE; --pet-bg:#1B3327;
    --focus:#8DB4EE;
    --accent:#F48FB1; --banner-bg:linear-gradient(105deg,#1A1E26 0%,#2A1E26 60%,#3A2230 100%); --banner-line:#3A2E36;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141A; --surface:#1A1E26; --surface-2:#222731; --line:#2E3440;
  --ink:#E8EBF1; --muted:#A3AABA; --faint:#747B8C;
  --def:#8DB4EE; --def-bg:#1E2B40;
  --atk:#F29B94; --atk-bg:#3A1F1E;
  --gold:#E9C46F; --gold-bg:#33291A; --gold-line:#5A4724;
  --warn:#F2C069; --warn-bg:#34281A;
  --pet:#8FD3AE; --pet-bg:#1B3327;
  --focus:#8DB4EE;
  --accent:#F48FB1; --banner-bg:linear-gradient(105deg,#1A1E26 0%,#2A1E26 60%,#3A2230 100%); --banner-line:#3A2E36;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.55 "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:18px 120px}

header.top{display:flex;flex-direction:column;gap:10px}
.banner{position:relative;overflow:hidden;min-height:184px;border-radius:18px;border:1px solid var(--banner-line);background:var(--banner-bg);display:flex;align-items:flex-end;padding:20px 18px}
.banner>img{position:absolute;right:0;top:0;height:100%;width:auto;max-width:72%;aspect-ratio:1/1;object-fit:cover;object-position:center 20%;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 38%);mask-image:linear-gradient(to right,transparent 0,#000 38%)}
.banner .brand{position:relative;z-index:1;max-width:60%}
.brand .kicker{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin-bottom:6px}
.brand .kicker::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.brand h1{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:38px;line-height:1.08;margin:0;letter-spacing:.01em}
.brand h1 em{font-style:normal;color:var(--accent)}
.brand .meta{color:var(--muted);font-size:13px;margin-top:8px;font-variant-numeric:tabular-nums}
.brand .meta input{width:8em;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;min-height:40px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--atk);border-color:var(--atk)}
.btn.on{background:var(--def-bg);border-color:var(--def);color:var(--def)}

.searchbar{background:var(--bg);padding-block:14px 10px;margin-top:8px}
.quick{display:flex;gap:6px;overflow-x:auto;padding-block:10px 2px;align-items:center;scrollbar-width:thin}
.quick .ql{flex:none;font-size:12.5px;font-weight:700;color:var(--muted)}
.quick button{flex:none;border:1.5px solid var(--def);background:var(--def-bg);color:var(--def);border-radius:999px;padding:6px 12px;min-height:36px;font-size:14px;font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding-top:8px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:36px;font-size:13.5px;font-weight:500;color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.star{position:absolute;top:4px;right:6px;border:0;background:none;font-size:21px;line-height:1;width:42px;height:42px;color:var(--faint);z-index:1}
.star[aria-pressed="true"]{color:#E3A008}
.new{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;color:#fff;background:#D9480F;border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:1px}
.gacts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.copybox{width:100%;min-height:220px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);font-size:14px;line-height:1.55}
.counter{width:100%;margin-top:2px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.mcell{display:grid;justify-items:center;gap:4px;padding:8px 4px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:13px;font-weight:700;color:var(--ink)}
.mcell .pt{width:44px;height:44px;border-radius:9px}
.mcell[aria-pressed="true"]{border-color:var(--def);background:var(--def-bg);color:var(--def)}
.mcell[aria-pressed="false"] .pt{filter:grayscale(1);opacity:.55}
.toc{display:flex;gap:6px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:thin}
.toc button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;min-height:36px;font-size:13.5px;font-weight:600;color:var(--muted)}
.toc button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-bg);color:var(--gold)}
.gfield{margin-bottom:12px}
.gfield input{font-size:16px;padding:11px 14px}
.gsh{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%}
.gsh:focus-visible{outline:2px solid var(--focus);outline-offset:4px;border-radius:8px}
.gsh h3{flex:1}
.gsec .chev{margin-left:auto}
.new.today{background:var(--def)}
.rtb{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;font-weight:700;font-size:15.5px}
.rcard.shut .rt{margin-bottom:0}
.rsub{font-size:12.5px;font-weight:500;color:var(--muted);margin-left:auto;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%}
.rcard .chev{font-size:12px;color:var(--faint);flex:none}
.gimg{cursor:zoom-in}
.hero[data-act]{cursor:pointer}
.notice{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:11px 14px;border-radius:12px;background:var(--warn-bg);color:var(--ink);font-size:14.5px;line-height:1.55;white-space:pre-wrap}
.notice small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.viewer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.94);overflow:auto;-webkit-overflow-scrolling:touch}
.viewer .vbar{position:sticky;top:0;left:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px calc(10px);background:rgba(0,0,0,.7);color:#fff;font-size:13px;z-index:1}
.viewer .vbar button{border:1px solid rgba(255,255,255,.4);background:none;color:#fff;border-radius:8px;padding:7px 12px;min-height:38px;font-size:14px}
.viewer img{display:block;width:100%;height:auto}
.viewer.full img{width:auto;max-width:none}
.sheet h2 .pt{width:42px;height:42px;border-radius:9px}
.hsec{font-size:12.5px;font-weight:700;color:var(--muted);margin:6px 2px -2px}
.linkbox{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);font-size:14px}
.mode{display:flex;gap:4px;margin-bottom:8px}
.mode button{border:0;background:none;padding:7px 12px;min-height:36px;border-radius:999px;font-size:14px;color:var(--muted);font-weight:500}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.field{position:relative}
.field input{width:100%;padding:13px 44px 13px 14px;font-size:17px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.field input:focus{border-color:var(--focus);outline:none}
.field .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:22px;color:var(--faint);width:44px;height:44px}
.hint{font-size:12.5px;color:var(--faint);margin-top:6px}
@media (max-width:480px){.hint{display:none}.brand h1{font-size:30px}.banner{min-height:168px;padding:16px 14px}.brand .kicker{font-size:10px;letter-spacing:.06em}.card{padding:12px}.deck{gap:6px}}
.heroes{display:flex;gap:6px;overflow-x:auto;padding-block:8px 2px;scrollbar-width:thin}
.heroes button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px}
.heroes button:hover{border-color:var(--muted)}

.count{font-size:13px;color:var(--muted);margin:6px 2px 10px;font-variant-numeric:tabular-nums}
.list{display:grid;gap:12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pcell{position:relative;display:grid;justify-items:center;gap:4px;padding:8px 4px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:13px;font-weight:700;color:var(--ink);text-align:center}
.pcell .pt{width:72px;height:72px;border-radius:12px}
.pcell .pt.fb{font-size:26px}
.pcell .pick{font-size:12px;font-weight:500;color:var(--def);cursor:pointer}
.pcell .pick input{position:absolute;width:1px;height:1px;opacity:0}
.pcell .rm{border:0;background:none;font-size:11.5px;color:var(--faint);padding:0}
.heroes button{display:inline-flex;align-items:center;gap:6px;min-height:36px}
.heroes .pt{width:28px;height:28px;border-radius:50%}
.heroes .pt.fb{font-size:12px}
.heroes button.has-pt{padding-left:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px}
.sect{display:grid;gap:6px}
.lbl{font-size:12.5px;font-weight:700;letter-spacing:.06em}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:14px;padding:4px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.tabs button{border:0;background:none;border-radius:10px;min-height:44px;font-size:15px;font-weight:700;color:var(--muted);padding:4px 2px}
@media (max-width:420px){.tabs button{font-size:14px}.tabs button span{display:none}}
.glinks{display:grid;gap:8px}
.glink{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:60px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none}
.glink:hover{border-color:var(--muted)}
.glink b{display:block;font-size:16px}
.glink small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.glink .go{margin-left:auto;flex:none;font-size:13px;font-weight:700;color:var(--def)}
.gnote{font-size:12.5px;color:var(--faint);margin:12px 2px 0}
.gchips{display:flex;gap:6px;overflow-x:auto;padding-block:12px 6px;scrollbar-width:thin}
.gchips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;min-height:38px;font-size:14px;font-weight:500;color:var(--ink)}
.gchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gintro{white-space:pre-wrap;font-size:14px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:12px 14px;margin:8px 0 12px;max-width:65ch}
.gsec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;margin-bottom:12px}
.gsec h3{margin:0;font-size:17px;text-wrap:balance}
.gsec .gn{white-space:pre-wrap;margin:0;font-size:14px;line-height:1.65;color:var(--ink)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.flow span{background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:8px;padding:4px 9px;font-size:14px;font-weight:500}
.flow i{font-style:normal;color:var(--faint);font-size:12px}
.turns{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.turns li{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;background:var(--surface-2);border-radius:9px;padding:7px 10px;font-size:15px}
.turns li b{font-size:12.5px;color:var(--gold)}
.glist{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14.5px;line-height:1.6}
.glist li{white-space:pre-wrap}
.rcards{display:grid;gap:8px}
.rcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.rcard .rt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15.5px;margin-bottom:6px}
.rcard .rt .pt{width:36px;height:36px;border-radius:8px}
.rcard dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;margin:0}
.rcard dt{font-size:12.5px;color:var(--muted);white-space:nowrap;padding-top:2px}
.rcard dd{margin:0;white-space:pre-wrap;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.gsrc{font-size:12.5px;color:var(--faint);margin:4px 2px 0}
.gimgs{display:grid;gap:8px;margin-top:2px}
.gimgs .lbl{color:var(--muted)}
.gimg{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#111}
.gsrc a{color:var(--def)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs button span{font-weight:500;font-size:13px;margin-left:4px;color:var(--faint)}
details.arch{margin-top:18px}
details.arch summary{cursor:pointer;list-style:none;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;color:var(--muted)}
details.arch summary::-webkit-details-marker{display:none}
details.arch summary::before{content:"▸ "}
details.arch[open] summary::before{content:"▾ "}
details.arch .list{margin-top:12px}
.dintro{margin:16px 2px 10px;font-size:14px;color:var(--muted)}
.dintro b{color:var(--ink);font-size:16px}
.or{align-self:center;font-size:13px;font-weight:500;color:var(--faint)}
.plan{display:grid;gap:6px}
.plan + .plan{margin-top:6px}
.plan small{font-size:12px;font-weight:700;color:var(--gold)}
.lbl .ctag{font-weight:500;letter-spacing:0;color:var(--muted)}
.lbl.def{color:var(--def)} .lbl.atk{color:var(--atk)} .lbl.sk{color:var(--gold)} .lbl.pet{color:var(--pet)}
.deck{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hero{display:grid;justify-items:center;align-content:start;gap:5px;padding:8px 4px 7px;border-radius:12px;border:2px solid transparent}
.deck.def .hero{background:var(--def-bg);color:var(--def)}
.deck.atk .hero{background:var(--atk-bg);color:var(--atk)}
.hero.hit{border-color:currentColor}
.deck .hero.any{background:var(--surface-2);color:var(--muted);border:2px dashed var(--line)}
.hero.any .pt.fb{background:transparent;font-size:34px;color:var(--faint)}
.pets{display:flex;flex-wrap:wrap;gap:8px}
/* 접힌 카드 (방어덱별 묶음) */
.grp{gap:8px;padding:12px 14px;position:relative}
.grp .glbl{padding-right:38px}
.ghead{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:6px;width:100%}
.ghead:focus-visible{outline:2px solid var(--focus);outline-offset:4px;border-radius:8px}
.glbl{font-size:12px;font-weight:700;color:var(--def);letter-spacing:.02em}
.orow{display:flex;align-items:center;gap:8px;min-width:0}
.mini{display:flex;gap:3px;flex:none}
.mini .pt{width:36px;height:36px;border-radius:8px}
.mini.atk .pt{width:32px;height:32px}
.mini .hit .pt{outline:2px solid var(--def);outline-offset:1px}
.mini .pt.fb{font-size:13px}
.mini .pt.any{background:var(--surface-2);border:1.5px dashed var(--line);color:var(--faint);opacity:1}
.onames{font-weight:700;font-size:14.5px;min-width:0;word-break:keep-all;overflow-wrap:anywhere;line-height:1.3}
.ghead .onames{font-size:15.5px}
.chev{margin-left:auto;color:var(--faint);font-size:14px;flex:none;padding-left:4px}
.gtags{display:flex;flex-wrap:wrap;gap:4px}
.gtags span{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.opts{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:8px}
.opt{display:flex;gap:8px;align-items:flex-start}
.ono{flex:none;font-size:11.5px;color:var(--gold);background:var(--gold-bg);border-radius:6px;padding:2px 6px;margin-top:7px}
.ob{display:grid;gap:3px;min-width:0}
.opt .onames{color:var(--atk)}
.osk{font-size:13px;color:var(--muted);padding-left:2px;line-height:1.45}
.tbd{font-size:12.5px;color:var(--faint);font-weight:500}
.deadtag{color:var(--warn);font-weight:700}
.opt.dead,.ofull.dead{opacity:.55}
.grp.dead{opacity:.65}
.gbody{display:grid;gap:14px;border-top:1px dashed var(--line);padding-top:10px}
.ofull{display:grid;gap:10px}
.ofull + .ofull{border-top:1px solid var(--line);padding-top:12px}
.ohd{font-weight:700;color:var(--gold);font-size:14px}
.pets .pet{display:inline-flex;align-items:center;gap:9px;padding:5px 14px 5px 5px;border-radius:12px;background:var(--pet-bg);color:var(--pet);font-weight:700;font-size:15px}
.pet .pt{width:48px;height:48px;border-radius:10px}
.pet .pt.fb{font-size:18px}
.pet small{display:block;font-size:11.5px;font-weight:500;opacity:.8;line-height:1.1}
.psec{font-size:13px;font-weight:700;color:var(--muted);margin-top:4px}
.hero .pt{width:100%;max-width:88px;height:auto;aspect-ratio:1/1;border-radius:10px}
.hero .pt.fb{font-size:30px}
.hero .nm{font-weight:700;font-size:15px;line-height:1.25;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
.pt{display:block;object-fit:cover;flex:none;background:var(--surface-2)}
.pt.fb{display:grid;place-items:center;font-style:normal;font-weight:700;background:var(--surface);opacity:.9}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.step{position:relative;display:grid;justify-items:center;gap:3px;min-width:74px;padding:8px 8px 7px;background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:12px;font-weight:500;font-size:13px;color:var(--ink)}
.step .n{position:absolute;top:-7px;left:-7px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--surface);font-size:12px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.step .pt{width:48px;height:48px;border-radius:9px}
.step .pt.fb{font-size:20px}
.step b{font-weight:700;font-size:15px;color:var(--gold)}
.step.raw{min-width:0;padding:6px 12px;font-size:15px}
.arrow{color:var(--faint);font-size:15px}
.unknown{display:inline-block;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:14.5px;font-weight:500}
details.memo{border-top:1px dashed var(--line);padding-top:8px}
details.memo summary{cursor:pointer;font-size:14.5px;color:var(--warn);font-weight:700;list-style:none;padding-block:6px}
details.memo summary::-webkit-details-marker{display:none}
details.memo summary::before{content:"▸ ";}
details.memo[open] summary::before{content:"▾ ";}
details.memo p{white-space:pre-wrap;margin:6px 0 0;font-size:15px;line-height:1.65;color:var(--ink);max-width:65ch}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--faint)}
.empty{text-align:center;color:var(--muted);padding:40px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.savebar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px}
.savebar .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.savebar .btn.ghost{background:none;color:var(--bg);border-color:var(--faint)}

.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(10,12,16,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
@media (min-width:600px){.sheet-bg{align-items:center}.sheet{border-radius:16px}}
.sheet h2{margin:0;font-size:18px}
.sheet label{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.sheet input,.sheet textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);font-size:15px;font-weight:400}
.sheet textarea{min-height:120px;resize:vertical}
.sheet .small{font-size:12px;color:var(--faint);font-weight:400}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sheet .acts .spacer{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:40;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

<script id="app">
(function(){
  var FONT_LINK = '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">';
  var state = JSON.parse(document.getElementById('data').textContent);
  if (!state.defense) state.defense = { version:'', decks:[] };
  var GIMG = JSON.parse(document.getElementById('gimgs').textContent || '{}');
  var portraits = JSON.parse(document.getElementById('portraits').textContent || '{}');
  var saved = JSON.stringify(state), savedP = JSON.stringify(portraits);
  // 카톡 스킬순서에서 쓰는 별명 → 영웅 이름
  var NICK = { '쁘':'브브' };
  var ui = { guide: (function(){ try { return localStorage.getItem('jokbo-guide') || 'pvp'; } catch(_){ return 'pvp'; } })(), tab: (location.hash === '#def' ? 'def' : location.hash === '#guide' ? 'guide' : 'atk'), q:'', mode:'def', open:{}, gopen:{}, rcopen:{}, gq:'', recent:false, mine:loadObj('jokbo-mine'), mineOnly:!!loadObj('jokbo-mine-only').on, fav:loadObj('jokbo-fav'), editMode:false, canEdit:false, art:null, sheet:null, delArm:false, saving:false, toast:'' };
  var root = document.getElementById('root');

  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function splitNames(s){ return String(s||'').split(/[\s,\/·]+/).map(function(x){return x.trim();}).filter(Boolean); }
  function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function dirtyCount(){
    var pd = JSON.stringify(portraits) === savedP ? 0 : 1;
    if (JSON.stringify(state) === saved) return pd;
    var old = JSON.parse(saved), n = 0, oldMap = {};
    old.entries.forEach(function(e){ oldMap[e.id] = JSON.stringify(e); });
    var ids = {};
    state.entries.forEach(function(e){ ids[e.id]=1; if (oldMap[e.id] !== JSON.stringify(e)) n++; });
    old.entries.forEach(function(e){ if (!ids[e.id]) n++; });
    if (old.version !== state.version) n++;
    if (JSON.stringify(old.defense||null) !== JSON.stringify(state.defense||null)) n++;
    n += pd;
    return Math.max(n,1);
  }

  /* ---------- 검색 ---------- */
  // 글자 하나하나를 서로 다른 영웅에 배정할 수 있으면 매치 (예: 실스동, 목윤하)
  function charAssign(chars, names, used){
    if (!chars.length) return true;
    var c = chars[0];
    for (var i=0;i<names.length;i++){
      if (!used[i] && names[i].indexOf(c) !== -1){
        used[i]=true;
        if (charAssign(chars.slice(1), names, used)) return true;
        used[i]=false;
      }
    }
    return false;
  }
  function tokenMatch(tok, names, alias){
    if (alias && alias.indexOf(tok) !== -1) return true;
    for (var i=0;i<names.length;i++) if (names[i].indexOf(tok) !== -1) return true;
    var chars = Array.from(tok);
    if (chars.length > names.length) return false;
    return charAssign(chars, names, {});
  }
  // '*' = 아무 영웅이나 오는 자리. 글자를 영웅에 먼저 배정하고, 남는 글자는 빈자리에 배정
  function charAssignW(chars, names, used, wild, namedHit){
    if (!chars.length) return namedHit ? wild : -1;
    var c = chars[0];
    for (var i=0;i<names.length;i++){
      if (!used[i] && names[i].indexOf(c) !== -1){
        used[i]=true;
        var r = charAssignW(chars.slice(1), names, used, wild, true);
        used[i]=false;
        if (r >= 0) return r;
      }
    }
    if (wild > 0) return charAssignW(chars.slice(1), names, used, wild-1, namedHit);
    return -1;
  }
  function matches(e){
    var toks = splitNames(ui.q);
    if (!toks.length) return true;
    var all = ui.mode === 'def' ? e.def : e.atk;
    var names = all.filter(function(n){ return n !== '*'; });
    var wild = all.length - names.length;
    var alias = ui.mode === 'def' ? e.alias : null;
    if (!wild) return toks.every(function(t){ return tokenMatch(t, names, alias); });
    if (!names.length) return ui.mode === 'def';  // 모든 방덱
    var namedHit = false;
    for (var k=0;k<toks.length;k++){
      var t = toks[k];
      if ((alias && alias.indexOf(t) !== -1) || names.some(function(n){ return n.indexOf(t) !== -1; })){ namedHit = true; continue; }
      var left = charAssignW(Array.from(t), names, {}, wild, false);
      if (left >= 0){ wild = left; namedHit = true; continue; }
      if (wild > 0){ wild--; continue; }  // 다른 영웅 이름 하나가 빈자리에 들어감
      return false;
    }
    return namedHit;
  }
  function hitSet(names){
    var toks = splitNames(ui.q), hit = {};
    toks.forEach(function(t){
      names.forEach(function(n,i){ if (n === t || (t.length>1 && n.indexOf(t)!==-1)) hit[i]=1; });
      if (Array.from(t).length <= names.length && !names.some(function(n){return n.indexOf(t)!==-1;})){
        Array.from(t).forEach(function(c){ names.forEach(function(n,i){ if (n.indexOf(c)!==-1) hit[i]=1; }); });
      }
    });
    return hit;
  }

  /* ---------- 스킬순서 ---------- */
  function parseSkill(skill, atk){
    var s = String(skill||'').trim();
    if (!s || /^\?+$/.test(s)) return null;
    // 글자는 영웅, 숫자는 그 영웅의 스킬 (예: "선 2 1" = 선란 2, 선란 1)
    var out = [], re = /([^\d\s,→>\-\.]+)|(\d)/g, m, cur = null;
    while ((m = re.exec(s))){
      if (m[1]){
        var t = NICK[m[1]] || m[1], hero = null;
        for (var i=0;i<atk.length;i++){ if (atk[i].indexOf(t)===0){ hero=atk[i]; break; } }
        if (!hero) for (var j=0;j<atk.length;j++){ if (atk[j].indexOf(t)!==-1){ hero=atk[j]; break; } }
        cur = hero || t;
      } else if (cur) out.push({ hero: cur, n: m[2] });
    }
    return out.length ? out : [{ raw: s }];
  }

  /* ---------- 렌더 ---------- */
  function pt(n, key){
    key = key || n;
    return portraits[key] ? '<img class="pt" src="'+esc(portraits[key])+'" alt="" loading="lazy">' :
      '<i class="pt fb" aria-hidden="true">'+esc(Array.from(n)[0]||'')+'</i>';
  }
  // how: 'rank' = 1순위/2순위, 'or' = 둘 중 아무거나
  function petsHTML(pets, how){
    return '<div class="pets">' + pets.map(function(p,i){
      var tag = (pets.length > 1 && how !== 'or') ? '<small>'+(i+1)+'순위</small>' : '';
      return (i && how === 'or' ? '<span class="or">또는</span>' : '') +
        '<span class="pet">' + pt(p, '펫:'+p) + '<span>' + tag + esc(p) + '</span></span>';
    }).join('') + '</div>';
  }
  function namesHTML(names, cls, hit){
    return '<div class="deck '+cls+'">' + names.map(function(n,i){
      if (n === '*') return '<div class="hero any"><i class="pt fb" aria-hidden="true">?</i><span class="nm">아무나</span></div>';
      return '<div class="hero'+(hit && hit[i] ? ' hit' : '')+'" data-act="hero-info" data-name="'+esc(n)+'" role="button" tabindex="0" aria-label="'+esc(n)+' 세팅 보기">' + pt(n) + '<span class="nm">'+esc(n)+'</span></div>';
    }).join('') + '</div>';
  }
  function skillHTML(e){ return stepsHTML(e.skill, e.atk); }
  function stepsHTML(skill, heroes){
    var p = parseSkill(skill, heroes);
    if (!p) return '<span class="tbd">스킬순서 미정</span>';
    if (p[0].raw) return '<span class="step raw">'+esc(p[0].raw)+'</span>';
    return '<div class="steps">' + p.map(function(s,i){
      return (i? '<span class="arrow">→</span>' : '') +
        '<span class="step"><span class="n">'+(i+1)+'</span>'+pt(s.hero)+'<span>'+esc(s.hero)+'</span><b>'+esc(s.n)+'스킬</b></span>';
    }).join('') + '</div>';
  }
  function cardHTML(e){
    var hd = ui.mode==='def' ? hitSet(e.def) : null, ha = ui.mode==='atk' ? hitSet(e.atk) : null;
    return '<article class="card">' +
      '<div class="sect"><div class="lbl def">상대 방어덱' + (e.tag ? ' <span class="ctag">· '+esc(e.tag)+'</span>' : '') + '</div>' + namesHTML(e.def,'def',hd) + '</div>' +
      '<div class="sect"><div class="lbl atk">공격덱</div>' + namesHTML(e.atk,'atk',ha) + '</div>' +
      (e.pet && e.pet.length ? '<div class="sect"><div class="lbl pet">펫'+(e.petOr && e.pet.length>1?' (하나만)':'')+'</div>' + petsHTML(e.pet, e.petOr?'or':'rank') + '</div>' : '') +
      '<div class="sect"><div class="lbl sk">스킬 순서</div>' + skillHTML(e) + '</div>' +
      (e.memo ? '<details class="memo"><summary>특이사항</summary><p>'+esc(e.memo)+'</p></details>' : '') +
      ((e.alias && e.alias.length) || e.src || ui.editMode ?
        '<div class="foot"><span>' + [e.alias && e.alias.length ? esc(e.alias.join(' · ')) : '', e.src ? '출처: '+esc(e.src) : ''].filter(Boolean).join(' · ') + '</span>' +
        (ui.editMode ? '<button class="btn" data-act="edit" data-id="'+esc(e.id)+'">수정</button>' : '') + '</div>' : '') +
      '</article>';
  }
  function defCardHTML(d, old){
    var sk = d.skills || [];
    return '<article class="card">' +
      '<div class="sect"><div class="lbl def">추천 방어덱</div>' + namesHTML(d.heroes,'def',null) + '</div>' +
      (d.pet && d.pet.length ? '<div class="sect"><div class="lbl pet">펫'+(d.pet.length>1?' (하나만)':'')+'</div>' + petsHTML(d.pet,'or') + '</div>' : '') +
      (sk.length ? '<div class="sect"><div class="lbl sk">스킬 순서</div>' + sk.map(function(x,i){
        return '<div class="plan">' + (sk.length > 1 ? '<small>'+(i+1)+'안</small>' : '') + stepsHTML(x, d.heroes) + '</div>';
      }).join('') + '</div>' : '') +
      (d.memo ? '<details class="memo" open><summary>특이사항</summary><p>'+esc(d.memo)+'</p></details>' : '') +
      (function(){
        var q = deckQuery(d.heroes), n = q ? countFor(q) : 0;
        return n ? '<button class="btn counter" data-act="find-counter" data-q="'+esc(q)+'">⚔ 이 덱 잡는 공략 보기 (전용 '+n+'개)</button>' : '';
      })() +
      (ui.editMode && !old ? '<div class="foot"><span></span><button class="btn" data-act="d-edit" data-id="'+esc(d.id)+'">수정</button></div>' : '') +
      '</article>';
  }
  /* ---------- 공략 모음 ---------- */
  function flowHTML(seq){
    return '<div class="flow">' + String(seq).split(' → ').map(function(x,i){
      return (i ? '<i>→</i>' : '') + '<span>'+esc(x)+'</span>';
    }).join('') + '</div>';
  }
  // 표 첫 칸(캐릭터 이름)을 초상화 이름으로: "각성 윤건", "라드그리드 (후열 방호)" → 윤건, 라드
  var FULLNAME = { '라드':'라드그리드', '란드':'란드그리드', '레긴':'레긴레이프', '실베':'실베스타', '탄지로':'카마도 탄지로', '젠이츠':'아가츠마 젠이츠' };
  function rowKey(t){ return String(t).replace(/\s*\(.*\)\s*$/,'').replace(/^각성\s+/,'').trim(); }
  function rowHero(t){
    var k = rowKey(t);
    if (portraits[k]) return k;
    for (var n in FULLNAME) if (FULLNAME[n] === k) return n;
    return k;
  }
  function rowTitle(t){
    var k = rowHero(t);
    return (portraits[k] ? pt(k) : '') + '<span>'+esc(t)+'</span>';
  }
  var COMPACT = { pvp:1, basics:1 };  // 캐릭터가 많은 공략은 카드를 접어서 보여줌
  function rowMatch(r, q){ return !q || String(r[0]).indexOf(q) >= 0 || rowHero(r[0]).indexOf(q) >= 0; }
  function rcardHTML(head, r, k, compact){
    var open = !compact || ui.rcopen[k];
    var fields = '<dl>' + head.slice(1).map(function(h,i){ var v = r[i+1]; return v ? '<dt>'+esc(h)+'</dt><dd>'+esc(v)+'</dd>' : ''; }).join('') + '</dl>';
    if (!compact) return '<div class="rcard"><div class="rt">'+rowTitle(r[0])+'</div>'+fields+'</div>';
    return '<div class="rcard'+(open ? '' : ' shut')+'"><button class="rt rtb" data-act="rc" data-k="'+esc(k)+'" aria-expanded="'+!!open+'">'+rowTitle(r[0]) +
      (open ? '' : '<small class="rsub">'+esc(String(r[1]||'').split('\n')[0])+'</small>') + '<span class="chev">'+(open ? '▴' : '▾')+'</span></button>' +

  /* ---------- 카톡 글 파서 ---------- */
  function parseKakao(text){
    var res = { version:null, entries:[] };
    var vm = text.match(/(\d{2}\.\d{2}\.\d{2})\s*_?\s*ver/i);
    if (vm) res.version = vm[1];
    var blocks = text.split(/\n\s*[-—–─―=_]{3,}\s*(?=\n|$)/);
    blocks.forEach(function(b){
      var lines = b.split('\n'), def=null, atk=null, alias=[], skill=null, memo=[], afterAtk=false, pet=[], petOr=false;
      lines.forEach(function(raw){
        var l = raw.trim();
        var md = l.match(/^방어\s*[-:：]?\s*(.+)$/);
        var ma = l.match(/^공격\s*[-:：]?\s*(.+)$/);
        if (md){
          var p = md[1].match(/^([^(（]+)[(（]([^)）]*)[)）]?/);
          def = splitNames(p ? p[1] : md[1]);
          if (p) alias = p[2].split(/[\/,\s]+/).filter(Boolean);
          return;
        }
        if (ma){ atk = splitNames(ma[1]); afterAtk = true; return; }
        if (!def) return;
        var mp = l.match(/^펫\s*[-:：]?\s*(.+)$/);
        if (mp){ petOr = /(^|\s)(or|또는)(\s|$)/i.test(mp[1]); pet = splitNames(mp[1].replace(/\d+\s*[.)]/g,' ')).filter(function(x){ return !/^(or|또는)$/i.test(x); }); return; }
        var ms = l.match(/^(스순|스킬순서)\s*[:：]?\s*(.+)$/);
        if (ms){ skill = ms[2].replace(/(\d)(?=[^\d\s])/g,'$1 ').trim(); return; }
        if (afterAtk && skill === null && l){ skill = l; return; }
        if (skill !== null) memo.push(raw.replace(/^\s*\*\s?/,'').replace(/\s+$/,''));
      });
      if (def && atk && def.length && atk.length){
        while (memo.length && !memo[0].trim()) memo.shift();
        while (memo.length && !memo[memo.length-1].trim()) memo.pop();
        res.entries.push({ id: uid()+res.entries.length, def:def, atk:atk, pet:pet, petOr:petOr, skill: skill || '???', alias:alias, memo: memo.join('\n') });
      }
    });
    return res;
  }
  function importPreview(text){
    if (!text.trim()) return '';
    var r = parseKakao(text);
    return '읽은 족보 ' + r.entries.length + '개' + (r.version ? ' · 버전 ' + r.version : '');
  }
  function sameKey(a,b){
    function k(x){ return x.slice().sort().join('|'); }
    return k(a.def)===k(b.def) && k(a.atk)===k(b.atk);
  }

      '<title>길드전 족보</title>\n' + FONT_LINK + '\n<style id="css">' + css + '</style>\n</head>\n<body>\n' +
      '<div id="root"></div>\n<script type="application/json" id="data">' + json + '<\/script>\n' +
      '<script type="application/json" id="gimgs">' + JSON.stringify(GIMG).replace(/</g,'\\u003c') + '<\/script>\n' +
      '<script type="application/json" id="portraits">' + JSON.stringify(portraits).replace(/</g,'\\u003c') + '<\/script>\n' +
      '<script id="app">' + app + '<\/script>\n</body>\n</html>\n';
  }
  function toast(msg){ ui.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(function(){ ui.toast=''; render(); }, 3200); }
  function save(){
    if (!ui.art){ toast('이 화면에서는 저장할 수 없어요.'); return; }
    ui.saving = true;
    var now = new Date();
    state.updated = ('0'+(now.getMonth()+1)).slice(-2) + '.' + ('0'+now.getDate()).slice(-2);  // 저장한 날짜가 맨 위에 표시됨
    render();
    ui.art.publish(buildDoc()).then(function(){
      saved = JSON.stringify(state); savedP = JSON.stringify(portraits); ui.saving = false; toast('저장했어요. 길드원 화면에도 반영돼요.');
    }).catch(function(err){
      ui.saving = false;
      var c = err && err.code;
      if (c === 'conflict') toast('다른 운영진이 먼저 저장했어요. 최신 버전으로 다시 불러와요.');
      else if (c === 'not_writer' || c === 'not_granted' || c === 'capability_disabled' || c === 'not_declared'){
        ui.canEdit = false; ui.editMode = false; toast('보기 전용이에요. 편집 권한이 있는 운영진만 저장할 수 있어요.');
      }
      else if (c === 'rate_limited') toast('저장이 너무 잦아요. 잠시 후 다시 눌러 주세요.');
      else toast('저장하지 못했어요. 잠시 후 다시 눌러 주세요.');
      render();
    });
  }

  /* ---------- 이벤트 ---------- */
  root.addEventListener('input', function(ev){
    var t = ev.target;
    if (t.id === 'q'){ ui.q = t.value; renderResults(); }
    else if (t.id === 'gq'){ ui.gq = t.value; var gb2 = document.getElementById('guidebody'); if (gb2) gb2.innerHTML = guideBodyHTML(curGuide()); }
    else if (t.id === 'ver'){ state.version = t.value.trim(); }
    else if (t.id === 'dver'){ state.defense.version = t.value.trim(); }
    else if (t.id === 'imp'){ ui.sheet.text = t.value; var p=document.getElementById('imp-preview'); if(p) p.textContent = importPreview(t.value); }
  });
  root.addEventListener('change', function(ev){
    var t = ev.target;
    if (t.id === 'ver' || t.id === 'dver') render();
    if (t.getAttribute && t.getAttribute('data-pt') && t.files && t.files[0]){
      var name = t.getAttribute('data-pt');
      shrink(t.files[0]).then(function(url){ portraits[name] = url; render(); })
        .catch(function(){ toast('이미지를 읽지 못했어요. PNG나 JPG 파일로 다시 올려 주세요.'); });
    }
  });
  // 가운데를 정사각형으로 잘라 160px로 줄임
  function shrink(file){
    return new Promise(function(resolve, reject){
      var fr = new FileReader();
      fr.onerror = reject;
      fr.onload = function(){
        var img = new Image();
        img.onerror = reject;
        img.onload = function(){
          var S = 160, c = document.createElement('canvas'); c.width = c.height = S;
          var side = Math.min(img.width, img.height);
          var sx = (img.width - side)/2, sy = (img.height - side)/2;
          c.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, S, S);
          var url = c.toDataURL('image/webp', 0.82);
          if (url.indexOf('data:image/webp') !== 0) url = c.toDataURL('image/jpeg', 0.85);
          resolve(url);
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  root.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-act]'); if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'close-bg' && ev.target !== b) return;
    if (a === 'mode'){ ui.mode = b.getAttribute('data-mode'); render(); }
    else if (a === 'clear'){ ui.q=''; render(); document.getElementById('q').focus(); }
    else if (a === 'hero'){
      var n = b.getAttribute('data-name'), toks = splitNames(ui.q);
      if (toks.indexOf(n) === -1) toks.push(n);
      ui.q = toks.join(' '); render();
    }
    else if (a === 'toggle-edit'){ ui.editMode = !ui.editMode; render(); }
    else if (a === 'tab'){
      ui.tab = b.getAttribute('data-tab');
      try { history.replaceState(null, '', '#' + ui.tab); } catch(_){}
      render(); window.scrollTo(0,0);
    }
    else if (a === 'gtoggle'){ var gk = b.getAttribute('data-k'); ui.open[gk] = !ui.open[gk]; renderResults(); }
    else if (a === 'gsec'){
      var gc0 = curGuide(), gi = +b.getAttribute('data-i'), go = gOpen(gc0);
      if (go[gi]) delete go[gi]; else go[gi] = 1;
      render();
    }
    else if (a === 'gtoc'){
      var gc1 = curGuide(), ti = +b.getAttribute('data-i');
      ui.gq = ''; ui.gopen[gc1.id] = {}; ui.gopen[gc1.id][ti] = 1; render();
      var se = document.getElementById('gs-' + ti);
      if (se && se.scrollIntoView) try { se.scrollIntoView({ block:'start' }); } catch(_){}
    }
    else if (a === 'gall'){
      var gc2 = curGuide(), all = {};
      (gc2.sections || []).forEach(function(_, j){ all[j] = 1; });
      ui.gopen[gc2.id] = all; render();
    }
    else if (a === 'rc'){
      var rk = b.getAttribute('data-k'); ui.rcopen[rk] = !ui.rcopen[rk];
      var gb = document.getElementById('guidebody'); if (gb) gb.innerHTML = guideBodyHTML(curGuide());
    }
    else if (a === 'zoom'){ openViewer(b.getAttribute('src'), b.getAttribute('alt')); }
    else if (a === 'hero-info'){ ui.sheet = { kind:'hero', name: b.getAttribute('data-name') }; render(); }
    else if (a === 'hero-atk'){
      ui.sheet = null; ui.tab = 'atk'; ui.mode = 'atk'; ui.q = b.getAttribute('data-name'); ui.recent = false;
      try { history.replaceState(null, '', '#atk'); } catch(_){}
      render(); window.scrollTo(0,0);
    }
    else if (a === 'notice'){ ui.sheet = { kind:'notice' }; render(); }
    else if (a === 'notice-apply'){
      var nt = document.getElementById('f-notice').value.trim(), nd0 = new Date();
      state.notice = nt ? { text: nt, date: ('0'+(nd0.getMonth()+1)).slice(-2)+'.'+('0'+nd0.getDate()).slice(-2) } : null;
      ui.sheet = null; render();
    }
    else if (a === 'fav'){
      var fk = b.getAttribute('data-k');
      if (ui.fav[fk]) delete ui.fav[fk]; else ui.fav[fk] = 1;
      saveObj('jokbo-fav', ui.fav); renderResults();
      toast(ui.fav[fk] ? '즐겨찾기에 넣었어요. 맨 위에 보여요.' : '즐겨찾기에서 뺐어요.');
    }
    else if (a === 'quick'){ ui.mode = 'def'; ui.q = b.getAttribute('data-q'); render(); }
    else if (a === 'recent-toggle'){ ui.recent = !ui.recent; render(); }
    else if (a === 'mine-toggle'){
      if (!Object.keys(ui.mine).length){ ui.sheet = { kind:'mine' }; ui.mineOnly = true; saveObj('jokbo-mine-only', { on:true }); render(); return; }
      ui.mineOnly = !ui.mineOnly; saveObj('jokbo-mine-only', { on: ui.mineOnly }); render();
    }
    else if (a === 'mine-set'){ ui.sheet = { kind:'mine' }; render(); }
    else if (a === 'mine-pick'){
      var mn = b.getAttribute('data-name');
      if (ui.mine[mn]) delete ui.mine[mn]; else ui.mine[mn] = 1;
      saveObj('jokbo-mine', ui.mine); render();
    }
    else if (a === 'mine-all'){ atkHeroes().forEach(function(n){ ui.mine[n] = 1; }); saveObj('jokbo-mine', ui.mine); render(); }
    else if (a === 'mine-none'){ ui.mine = {}; saveObj('jokbo-mine', ui.mine); render(); }
    else if (a === 'mine-done'){
      ui.sheet = null;
      if (Object.keys(ui.mine).length){ ui.mineOnly = true; saveObj('jokbo-mine-only', { on:true }); }
      render();
    }
    else if (a === 'find-counter'){
      ui.tab = 'atk'; ui.mode = 'def'; ui.q = b.getAttribute('data-q'); ui.recent = false;
      try { history.replaceState(null, '', '#atk'); } catch(_){}
      render(); window.scrollTo(0,0);
    }
    else if (a === 'copy-kakao'){
      var ck = b.getAttribute('data-k');
      var cg = groupsOf(state.entries).filter(function(x){ return x.key === ck; })[0];
      if (cg) copyText(kakaoGroupText(cg), '카톡용 글을 복사했어요. 카톡에 붙여넣으세요.');
    }
    else if (a === 'weekly'){ ui.sheet = { kind:'weekly', text: weeklyText() }; render(); }
    else if (a === 'weekly-copy'){ var wt = ui.sheet.text; ui.sheet = null; render(); copyText(wt, '이번 주 요약을 복사했어요. 카톡 길드방에 붙여넣으세요.'); }
    else if (a === 'copy-link'){
      var url = linkFor(b.getAttribute('data-id'));
      var showBox = function(){ ui.sheet = { kind:'link', url:url }; render(); var lb = document.getElementById('linkbox'); if (lb){ lb.focus(); lb.select(); } };
      try {
        navigator.clipboard.writeText(url).then(function(){ toast('링크를 복사했어요. 카톡에 붙여넣으면 이 족보가 바로 열려요.'); }, showBox);
      } catch(_){ showBox(); }
    }
    else if (a === 'dver-sel'){ ui.defVer = b.getAttribute('data-v'); render(); }
    else if (a === 'gsel'){
      ui.guide = b.getAttribute('data-id'); ui.gq = '';
      try { localStorage.setItem('jokbo-guide', ui.guide); } catch(_){}
      render();
      var gc = root.querySelector('.gchips button[aria-pressed="true"]');
      if (gc && gc.scrollIntoView) try { gc.scrollIntoView({ block:'nearest', inline:'center' }); } catch(_){}
    }
    else if (a === 'd-add'){ ui.delArm=false; ui.sheet = { kind:'dedit', isNew:true, deck:{ id:uid(), heroes:[], pet:[], skills:[], memo:'' } }; render(); document.getElementById('f-dh').focus(); }
    else if (a === 'd-edit'){
      var did0 = b.getAttribute('data-id');
      var dk = state.defense.decks.filter(function(x){ return x.id===did0; })[0];
      ui.delArm=false; ui.sheet = { kind:'dedit', isNew:false, deck: JSON.parse(JSON.stringify(dk)) }; render();
    }
    else if (a === 'd-apply'){
      var nd = readDeckForm();
      if (!nd.heroes.length){ toast('영웅을 적어 주세요.'); return; }
      if (ui.sheet.isNew) state.defense.decks.push(nd);
      else state.defense.decks = state.defense.decks.map(function(x){ return x.id===nd.id ? nd : x; });
      ui.sheet = null; render();
    }
    else if (a === 'd-delete'){
      if (!ui.delArm){ ui.delArm = true; ui.sheet.deck = readDeckForm(); render(); return; }
      var ddid = ui.sheet.deck.id;
      state.defense.decks = state.defense.decks.filter(function(x){ return x.id !== ddid; });
      ui.sheet = null; ui.delArm=false; render();
    }
    else if (a === 'add'){ ui.delArm=false; ui.sheet = { kind:'edit', isNew:true, entry:{ id:uid(), def:[], atk:[], pet:[], skill:'???', alias:[], memo:'' } }; render(); document.getElementById('f-def').focus(); }
    else if (a === 'import'){ ui.sheet = { kind:'import', text:'' }; render(); document.getElementById('imp').focus(); }
    else if (a === 'edit'){
      var id = b.getAttribute('data-id');
      var e = state.entries.filter(function(x){return x.id===id;})[0];
      ui.delArm=false; ui.sheet = { kind:'edit', isNew:false, entry: JSON.parse(JSON.stringify(e)) }; render();
    }
    else if (a === 'close' || a === 'close-bg'){ ui.sheet = null; render(); }
    else if (a === 'apply'){
      var f = readForm();
      if (!f.def.length || !f.atk.length){ toast('방어덱과 공격덱을 적어 주세요.'); return; }
      if (!f.added) f.added = today();
      f.updatedAt = today();  // NEW 표시용
      if (ui.sheet.isNew) state.entries.push(f);
      else state.entries = state.entries.map(function(x){ return x.id===f.id ? f : x; });
      ui.sheet = null; render();
    }
    else if (a === 'delete'){
      if (!ui.delArm){ ui.delArm = true; ui.sheet.entry = readForm(); render(); return; }
      var did = ui.sheet.entry.id;
      state.entries = state.entries.filter(function(x){ return x.id !== did; });
      ui.sheet = null; ui.delArm=false; render();
    }
    else if (a === 'do-import'){
      var r = parseKakao(ui.sheet.text || '');
      if (!r.entries.length){ toast('족보를 읽지 못했어요. "방어 -", "공격 -" 줄이 있는지 확인해 주세요.'); return; }
      var added = 0, replaced = 0;
      r.entries.forEach(function(ne){
        var idx = -1;
        state.entries.forEach(function(x,i){ if (sameKey(x,ne)) idx=i; });
        ne.updatedAt = today();
        if (idx >= 0){ ne.id = state.entries[idx].id; ne.added = state.entries[idx].added || today(); state.entries[idx] = ne; replaced++; }
        else { ne.added = today(); state.entries.push(ne); added++; }
      });
      if (r.version) state.version = r.version;
      ui.sheet = null; toast('새로 '+added+'개, 바뀐 것 '+replaced+'개. 아래 저장을 눌러야 반영돼요.');
    }
    else if (a === 'discard'){ state = JSON.parse(saved); portraits = JSON.parse(savedP); render(); }
    else if (a === 'portraits'){ ui.sheet = { kind:'portraits' }; render(); }
    else if (a === 'pt-rm'){ delete portraits[b.getAttribute('data-name')]; render(); }
    else if (a === 'save'){ save(); }
  });
  document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape' && ui.sheet){ ui.sheet=null; render(); } });

  render();

  /* ---------- 족보 링크로 들어왔을 때 (#e12 같은 주소): 그 방어덱을 펼쳐서 보여줌 ---------- */
  (function(){
    var m = /^#([eg][0-9a-z]+)$/i.exec(location.hash || '');
    if (!m) return;
    var hit = state.entries.filter(function(e){ return e.id === m[1]; })[0];
    if (!hit) return;
    ui.tab = 'atk'; ui.q = ''; ui.recent = false; ui.mineOnly = false;
    ui.open[grpKey(hit)] = true;
    render();
    var g = groupsOf(state.entries).filter(function(x){ return x.key === grpKey(hit); })[0];
    var el = g && document.getElementById('g-' + g.anchor);
    if (el && el.scrollIntoView) setTimeout(function(){ try { el.scrollIntoView({ block:'start' }); } catch(_){} }, 60);
  })();

  /* ---------- 운영진 권한 확인 ---------- */
  if (window.claude && window.claude.use){
    Promise.all([window.claude.use('user'), window.claude.use('artifact')]).then(function(r){
      var user = r[0], art = r[1];
      if (!user || !art) return;
      ui.art = art;
      return user.canEdit().then(function(ok){ if (ok){ ui.canEdit = true; render(); } });
    }).catch(function(){});
  }
})();
</script>
</body>
